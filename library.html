<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IA-Tutor | Years 9–13 Library</title><link rel="stylesheet" href="styles.css"><style>.lib{max-width:1200px;margin:auto;padding:24px}.hero{padding:30px;border-radius:24px;background:linear-gradient(110deg,#0874dc,#4c22c8);color:#fff}.hero h1{color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:18px}.card{background:#fff;border:1px solid #d9e5f3;border-radius:18px;padding:18px;box-shadow:0 10px 25px #1f487d12}.card h3{color:#0b2f62}.card button{background:#1167d8;color:#fff}.back{display:inline-block;margin:14px 0;color:#1167d8;font-weight:700}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="lib"><a class="back" href="/">← Back to IA-Tutor</a><section class="hero"><p>🇫🇯 INDUSTRIAL ARTS • YEARS 9–13</p><h1>📚 Industrial Arts Library</h1><p>Explore subjects, materials, tools, workshop practice, Technical Drawing, Applied Technology, CAD and research.</p></section><div class="grid" id="library"></div></main><script>const areas=[['Year 9','Basic Technology','Tools, materials, workshop safety and practical technology.'],['Year 10','Basic Graphics Technology','Graphics, drawing, design and practical activities.'],['Year 11','Technical Drawing','Technical drawing, dimensioning and CAD foundations.'],['Year 11','Applied Technology','Materials, processes, tools and applied projects.'],['Year 12','Technical Drawing','Advanced technical drawing and CAD practice.'],['Year 12','Applied Technology','Advanced materials, processes and project work.'],['Year 13','Technical Drawing','Advanced drawing, CAD and examination preparation.'],['Year 13','Applied Technology','Applied technology, design and project development.'],['Years 9–13','Materials & Workshop','Timber, metals, plastics, tools, joining, finishing and OHS.']];document.getElementById('library').innerHTML=areas.map(a=>`<article class="card"><h3>${a[0]} • ${a[1]}</h3><p>${a[2]}</p><button onclick="location.href='research.html'">🤖 Research with AI</button></article>`).join('');</script></body></html>

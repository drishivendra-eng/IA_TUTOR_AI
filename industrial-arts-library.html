<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IA-Tutor | Industrial Arts Library</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eef5ff;color:#12335b}.wrap{max-width:1200px;margin:auto;padding:24px}.hero{padding:32px;border-radius:24px;background:linear-gradient(120deg,#0874dc,#4c22c8);color:#fff}.hero h1{margin:8px 0;color:#fff}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:20px 0}.tools input,.tools select{padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border-radius:18px;padding:20px;border:1px solid #d8e4f2;box-shadow:0 8px 20px #12335b12}.tag{font-size:12px;font-weight:bold;color:#2563a6;background:#eaf2ff;border-radius:999px;padding:6px 9px}.card h2{font-size:21px;margin:12px 0 8px}.card p{line-height:1.5;color:#475569}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 14px;margin:4px 4px 0 0;color:#fff;background:#4c2bd9;font-weight:800;text-decoration:none;cursor:pointer}.ai{background:#1167d8}.count{font-weight:800;margin:14px 0}.empty{background:#fff;padding:30px;border-radius:16px;text-align:center}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.tools{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/" style="font-weight:bold">← IA-Tutor Home</a><section class="hero"><div>🇫🇯 YEARS 9–13 • INDUSTRIAL ARTS</div><h1>📚 Industrial Arts Library</h1><p>Find the correct year and subject first. Open Resources takes students to the dedicated resource viewer; Ask AI opens research for that exact subject.</p></section><section class="tools"><input id="q" placeholder="🔎 Search Industrial Arts…"><select id="y"><option value="all">All Years</option><option>Year 9</option><option>Year 10</option><option>Year 11</option><option>Year 12</option><option>Year 13</option></select><select id="s"><option value="all">All Subjects</option><option>Basic Technology</option><option>Basic Graphics Technology</option><option>Technical Drawing</option><option>Applied Technology</option><option>Materials & Workshop</option></select></section><div id="count" class="count"></div><section id="grid" class="grid"></section></main><script>const A=[['Year 9','Basic Technology','Tools, materials, workshop safety and practical technology.'],['Year 9','Basic Graphics Technology','Graphics, lettering, instruments and design.'],['Year 10','Basic Technology','Tools, materials, processes and workshop practice.'],['Year 10','Basic Graphics Technology','Graphics, drawing, design and practical activities.'],['Year 11','Technical Drawing','Technical drawing, dimensioning and CAD foundations.'],['Year 11','Applied Technology','Materials, processes, tools and applied projects.'],['Year 12','Technical Drawing','Advanced technical drawing and CAD practice.'],['Year 12','Applied Technology','Advanced materials, processes and project work.'],['Year 13','Technical Drawing','Advanced drawing, CAD and examination preparation.'],['Year 13','Applied Technology','Applied technology, design and project development.'],['Years 9–13','Materials & Workshop','Timber, metals, plastics, tools, joining, finishing and OHS.']];const e=id=>document.getElementById(id),u=x=>encodeURIComponent(x);function draw(){let q=e('q').value.toLowerCase(),y=e('y').value,s=e('s').value;let r=A.filter(a=>(y==='all'||a[0]===y)&&(s==='all'||a[1]===s)&&(!q||a.join(' ').toLowerCase().includes(q)));e('count').textContent=r.length+' learning areas';e('grid').innerHTML=r.length?r.map(a=>`<article class="card"><span class="tag">${a[0]}</span><h2>${a[1]}</h2><p>${a[2]}</p><a class="btn" href="resource.html?year=${u(a[0])}&subject=${u(a[1])}">📂 Open Resources</a><a class="btn ai" href="research.html?year=${u(a[0])}&subject=${u(a[1])}">🤖 Ask AI</a></article>`).join(''):'<div class="empty">No matching Industrial Arts area. Try another search.</div>'}e('q').oninput=draw;e('y').onchange=draw;e('s').onchange=draw;draw();</script></body></html>
